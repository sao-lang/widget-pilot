# M01 §3.3：SPA fallback + /healthz（nginx alpine 静态托管）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康探针（容器 HEALTHCHECK 依赖）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback：前端路由全部回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
