[project]
name = "widgetpilot"
version = "1.0.0"
description = "WidgetPilot monorepo 根工程（M01 §3.3：uv workspace，依赖层缓存与 lockfile 确定性）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # M05：FastAPI multipart 上传（§2.1）
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # 以下为各模块 §2 技术栈已定稿的运行期基础库（M01 §11.7 差异核对补入）
    "tiktoken>=0.8",        # M03/M07/M10：纯 token 计数
    "Pillow>=11.0",         # M05：图片只读解码
    "jsonschema>=4.23",     # M06/M02：JSON Schema 校验器
    # M06 进护栏：成熟专用库（PII 真值校验 + 敏感词 DFA 多模式匹配）
    "phonenumbers>=9.0",    # 手机号/区号格式与归属校验
    "id-validator>=1.0",    # 大陆身份证校验位/地区码校验
    "email-validator>=2.2",  # 邮箱语法与可投递性形状校验
    "pyahocorasick>=2.0",   # 敏感词 Aho-Corasick 自动机
    # M04 §2 技术栈：认证与租户基座的运行期依赖
    "PyJWT>=2.8",           # M04：JWT 签发/校验（access + refresh）
    "argon2-cffi>=23.1",    # M04：密码哈希（只存 hash）
    "redis>=5.0",           # M04：Redis Streams 队列/SSE 扇出/限流
    "bcrypt>=4.0",          # M04：密码哈希备选（argon2 不可用时）
    # M05 对象存储用 httpx + SigV4 直连 MinIO（已在基础依赖），无 boto3
    "rapidocr-onnxruntime>=1.4.4",  # M05：content_extraction 区域化 OCR（§2.1）
    "imageio-ffmpeg>=0.8.1",  # M05：视频关键帧（§2.1，自带静态二进制）
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
