# ============================================================
# WidgetPilot 本地开发依赖栈（M01 §1.2 R1–R3 / §3.1 / §4.1）
# 设计：依赖容器化、应用本机化——db/redis/minio/otel 进容器，
#       应用服务默认跑本机（--profile full 时容器化热重载）。
# 命令：docker compose --profile core up -d --wait（Makefile 封装）
# 端口默认绑 127.0.0.1（§4.5）；破坏性重置走 CONFIRM=dev-reset make dev-reset
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-widgetpilot-dev}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# full 组应用服务统一 env（§6.1/§6.2）：变量名与本机 .env 完全一致，
# 仅把主机名部分覆写为容器网络名——12-factor 配置同构
x-app-env: &app-env
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_USER: ${POSTGRES_USER:-widgetpilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-widgetpilot_dev}
  POSTGRES_DB: ${POSTGRES_DB:-widgetpilot}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-widgetpilot}:${POSTGRES_PASSWORD:-widgetpilot_dev}@postgres:5432/${POSTGRES_DB:-widgetpilot}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wpdev}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-wpdev-secret}
  S3_BUCKET: ${S3_BUCKET:-wp-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}

services:
  # ---------- core：日常开发最小集 ----------
  # pgvector/pgvector:pg16 = 官方 postgres:16 + pgvector 预装（M01 initdb 兜底；镜像选择最终归 M10 定稿）
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core", "full", "sandbox"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-widgetpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-widgetpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-widgetpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    profiles: ["core", "full", "sandbox"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["core", "full", "sandbox"]
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wpdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wpdev-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # 一次性桶初始化（§4.1 createbuckets；完成即 exit 0，禁用 restart）
  createbuckets:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    profiles: ["core", "full", "sandbox"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-wp-dev} &&
      mc anonymous set none local/${S3_BUCKET:-wp-dev} &&
      echo 'buckets initialized (key prefixes: att/ spec/ code/ bundle/ evidence/ checkpoint/ eval/ audit/) [01 基线 §9]';
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wpdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wpdev-secret}
    restart: "no"
    logging: *default-logging

  # ---------- observability：可选观测组（配置复用 infra/observability/，本模块零自定义）----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # ---------- full：全容器热重载模式（应用服务镜像 :dev，§4.1）----------
  control-plane:
    build:
      context: .
      dockerfile: infra/docker/control-plane.Dockerfile
      tags: ["widgetpilot/control-plane:dev"]
    image: widgetpilot/control-plane:dev
    profiles: ["full"]
    command: ["uvicorn", "services.control_plane.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  orchestrator:
    build:
      context: .
      dockerfile: infra/docker/orchestrator.Dockerfile
      tags: ["widgetpilot/orchestrator:dev"]
    image: widgetpilot/orchestrator:dev
    profiles: ["full"]
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  guardrails:
    build:
      context: .
      dockerfile: infra/docker/guardrails.Dockerfile
      tags: ["widgetpilot/guardrails:dev"]
    image: widgetpilot/guardrails:dev
    profiles: ["full"]
    command: ["uvicorn", "services.guardrails.api.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    ports:
      - "127.0.0.1:8100:8100"
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  retriever:
    build:
      context: .
      dockerfile: infra/docker/retriever.Dockerfile
      tags: ["widgetpilot/retriever:dev"]
    image: widgetpilot/retriever:dev
    profiles: ["full"]
    command: ["uvicorn", "services.retriever.api.main:app", "--host", "0.0.0.0", "--port", "8200", "--reload"]
    ports:
      - "127.0.0.1:8200:8200"
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  sandbox-runner:
    build:
      context: .
      dockerfile: infra/docker/sandbox_runner.Dockerfile
      tags: ["widgetpilot/sandbox-runner:dev"]
    image: widgetpilot/sandbox-runner:dev
    profiles: ["full"]
    command: ["uvicorn", "services.sandbox_runner.api.main:app", "--host", "0.0.0.0", "--port", "8300", "--reload"]
    ports:
      - "127.0.0.1:8300:8300"
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  eval-runner:
    build:
      context: .
      dockerfile: infra/docker/eval_runner.Dockerfile
      tags: ["widgetpilot/eval-runner:dev"]
    image: widgetpilot/eval-runner:dev
    profiles: ["full"]
    # 作业型：无常驻端口，command 由回放任务覆写
    entrypoint: ["python", "-m", "services.eval_runner.worker"]
    environment: *app-env
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: infra/docker/web-dev.Dockerfile
      tags: ["widgetpilot/web-dev:dev"]
    image: widgetpilot/web-dev:dev
    profiles: ["full"]
    # full 模式跑 vite dev（镜像为 node 基座 + 源码；prod nginx 形态见 web.Dockerfile）
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE: http://control-plane:8000
    volumes:
      # 源码热重载：只挂源码子路径，避免遮蔽镜像内的 node_modules（依赖符号链接）
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ./packages:/app/packages:ro
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  bff:
    build:
      context: .
      dockerfile: infra/docker/bff.Dockerfile
      tags: ["widgetpilot/bff:dev"]
    image: widgetpilot/bff:dev
    profiles: ["full"]
    # M02 可选 BFF 层：SSO / 首屏聚合 / 短期 SSE ticket（不做鉴权判定）
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      BFF_PORT: "8010"
    volumes:
      - ./apps/bff:/app/apps/bff:ro
      - ./packages:/app/packages:ro
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redis-data:
  minio-data:
  grafana-data:
  loki-data:
