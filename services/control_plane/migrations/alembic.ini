# M01 §6.5: schema migration entry (Alembic; dual-track before finalization).
# Business table DDL belongs to M04/M11 owners; this carries the version chain skeleton.
# NOTE: keep ASCII-only (Windows GBK locale-safe).
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../../..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
